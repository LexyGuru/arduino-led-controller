name: Tauri staging artifact build

on:
  workflow_dispatch:

  push:
    branches:
      - next/v5-rearchitecture
      - "feature/v5-*"
    paths:
      - "desktop-tauri/**"
      - "docs/api/openapi-v2.json"
      - "scripts/generate-openapi-typescript.js"
      - ".github/workflows/tauri-artifact-build.yml"

permissions:
  contents: read

jobs:
  build-desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux staging artifact
            os: ubuntu-22.04
            bundles: appimage,deb
            artifact_name: arduino-led-controller-linux-staging
          - name: macOS staging artifact
            os: macos-latest
            bundles: dmg
            artifact_name: arduino-led-controller-macos-staging
          - name: Windows staging artifact
            os: windows-latest
            bundles: nsis
            artifact_name: arduino-led-controller-windows-staging

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: desktop-tauri

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Check Rust backend
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Test Rust backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Build Tauri staging package
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: desktop-tauri
          args: --bundles ${{ matrix.bundles }}

      - name: Upload Linux staging packages
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop-tauri/src-tauri/target/release/bundle/deb/*.deb
            desktop-tauri/src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload macOS staging package
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 14
          path: desktop-tauri/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload Windows staging package
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 14
          path: desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe
