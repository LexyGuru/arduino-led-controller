name: Build unsigned iOS IPA

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "desktop-tauri/**"
      - ".github/workflows/Build_iOS.yml"

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-15

    defaults:
      run:
        shell: bash
        working-directory: desktop-tauri

    steps:
      # ============================================================
      # FORRÁSKÓD LETÖLTÉSE
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # NODE.JS TELEPÍTÉSE
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ============================================================
      # RUST ÉS IOS TARGET TELEPÍTÉSE
      # ============================================================
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      # ============================================================
      # JAVASCRIPT FÜGGŐSÉGEK
      # ============================================================
      - name: Install dependencies
        run: npm install

      # A --no-sign opció Tauri CLI 2.11.0-tól érhető el.
      # Kifejezetten a 2.11.4 verziót használjuk.
      - name: Install Tauri CLI 2.11.4
        run: |
          npm install \
            --no-save \
            --package-lock=false \
            @tauri-apps/cli@2.11.4

      # ============================================================
      # VERZIÓK KIÍRÁSA
      # ============================================================
      - name: Display build versions
        run: |
          echo "Node:"
          node --version

          echo "NPM:"
          npm --version

          echo "Rust:"
          rustc --version

          echo "Cargo:"
          cargo --version

          echo "Tauri:"
          npx tauri --version

          echo "Xcode:"
          xcodebuild -version

      # ============================================================
      # IOS PROJEKT GENERÁLÁSA
      # ============================================================
      - name: Initialize Tauri iOS project
        run: |
          npx tauri ios init --ci

      # ============================================================
      # IOS IPA FORDÍTÁSA ALÁÍRÁS NÉLKÜL
      # ============================================================
      - name: Build unsigned iOS IPA
        run: |
          npx tauri ios build --ci --no-sign

      # ============================================================
      # IPA MEGKERESÉSE ÉS ÁTNEVEZÉSE
      # ============================================================
      - name: Collect generated IPA
        run: |
          set -euo pipefail

          echo "Elkészült IPA fájlok keresése..."

          IPA_PATH="$(find . -type f -name "*.ipa" -print -quit)"

          if [ -z "${IPA_PATH}" ]; then
            echo "::error::Nem található elkészült IPA fájl."

            echo "A generált Apple projekt tartalma:"
            find src-tauri/gen/apple \
              -maxdepth 10 \
              -type f \
              2>/dev/null \
              | sort \
              | tail -n 300 \
              || true

            exit 1
          fi

          echo "Megtalált IPA:"
          echo "${IPA_PATH}"

          mkdir -p artifacts

          cp "${IPA_PATH}" \
            "artifacts/Arduino_LED_Controller_3.0.18_unsigned.ipa"

          echo "Az IPA tartalma:"
          unzip -l \
            "artifacts/Arduino_LED_Controller_3.0.18_unsigned.ipa" \
            | head -n 60

          echo "Az IPA mérete:"
          ls -lh \
            "artifacts/Arduino_LED_Controller_3.0.18_unsigned.ipa"

      # ============================================================
      # IPA FELTÖLTÉSE A GITHUB ACTIONS ARTIFACTOK KÖZÉ
      # ============================================================
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Arduino-LED-Controller-iOS-Unsigned-IPA
          path: desktop-tauri/artifacts/Arduino_LED_Controller_3.0.18_unsigned.ipa
          if-no-files-found: error
          retention-days: 30
