name: Build iOS for Sideload
on:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: desktop-tauri

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install dependencies
        run: npm install

      # Tauri iOS app fordítása kódaláírás nélkül
      - name: Build Tauri App for iOS
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGN_IDENTITY: ""
          PROVISIONING_PROFILE_SPECIFIER: ""
        with:
          projectPath: desktop-tauri
          args: --target aarch64-apple-ios

      # Intelligens keresés és IPA csomagolás a Sideloadly számára
      - name: Package IPA for Sideloadly
        run: |
          mkdir -p Payload
          
          # Megkeressük, hova rakta az Xcode a fordítás eredményét (.app mappa)
          APP_PATH=$(find src-tauri/gen/apple/build -name "*.app" -type d | head -n 1)
          
          if [ -n "$APP_PATH" ]; then
            echo "Megtalált .app fájl: $APP_PATH"
            cp -r "$APP_PATH" Payload/
          else
            echo "Nem találtam .app fájlt, ellenőrzöm az xcarchive-ot..."
            # Ha archívum készült, abból szedjük ki az appot
            ARCHIVE_PATH=$(find src-tauri/gen/apple/build -name "*.xcarchive" -type d | head -n 1)
            if [ -n "$ARCHIVE_PATH" ]; then
              cp -r "$ARCHIVE_PATH/Products/Applications/"*.app Payload/
            else
              echo "Hiba: Egyik formátumot sem találtam a build mappában!"
              exit 1
            fi
          fi
          
          # Becsomagoljuk és kimentjük a gyökérbe
          zip -r ../sideload_app.ipa Payload

      # A kész IPA feltöltése a GitHub felületére
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-ios-sideload-ipa
          path: sideload_app.ipa
