name: Build iOS for Sideload
on:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: desktop-tauri

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Az iOS-hez szükséges natív célarchitektúra
          targets: aarch64-apple-ios

      - name: Install dependencies
        run: npm install

      # A tauri-action helyett közvetlenül a Tauri CLI-vel kényszerítjük ki az iOS buildet kódaláírás nélkül
      - name: Build Tauri App for iOS
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGN_IDENTITY: ""
          PROVISIONING_PROFILE_SPECIFIER: ""
        run: npx tauri ios build -- --skip-packaging

      # Csomagolás a Sideloadly számára
      - name: Package IPA for Sideloadly
        run: |
          mkdir -p Payload
          
          # Megkeressük az igazi Xcode build mappát, ami most már létrejön
          APP_PATH=$(find src-tauri/gen/apple/build -name "*.app" -type d | head -n 1)
          
          if [ -n "$APP_PATH" ]; then
            echo "Megtalált .app mappa: $APP_PATH"
            cp -r "$APP_PATH" Payload/
          else
            echo "Közvetlen .app nem található, keresés az xcode-products mappában..."
            # Biztonsági mentés, ha az Xcode máshova tenné az un-signed terméket
            APP_BACKUP=$(find src-tauri/gen/apple -name "*.app" -type d | grep -v "Artifacts" | head -n 1)
            if [ -n "$APP_BACKUP" ]; then
              cp -r "$APP_BACKUP" Payload/
            else
              echo "Hiba: Nem található generált iOS .app fájl!"
              exit 1
            fi
          fi
          
          # Becsomagoljuk az IPA-t a gyökérkönyvtárba
          zip -r ../sideload_app.ipa Payload

      # Az IPA fájl feltöltése a GitHub felületére
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-ios-sideload-ipa
          path: sideload_app.ipa
