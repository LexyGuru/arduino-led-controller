name: Build iOS for Sideload
on:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: desktop-tauri

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install dependencies
        run: npm install

      # 1. LÉPÉS: Az Xcode projekt automatikus generálása üres bemenettel (Enter küldésével)
      - name: Initialize Tauri iOS Project
        run: echo "" | npx tauri ios init

      # 2. LÉPÉS: A Tauri iOS app fordítása kódaláírás nélkül, kamu Team ID-val
      - name: Build Tauri App for iOS
        env:
          APPLE_DEVELOPMENT_TEAM: "12345ABCDE" # Kamu azonosító a Tauri megnyugtatására
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGN_IDENTITY: ""
          PROVISIONING_PROFILE_SPECIFIER: ""
        run: npx tauri ios build -- --skip-packaging

      # 3. LÉPÉS: Csomagolás a Sideloadly számára
      - name: Package IPA for Sideloadly
        run: |
          mkdir -p Payload
          
          # Megkeressük a generált iOS alkalmazást
          APP_PATH=$(find src-tauri/gen/apple -name "*.app" -type d | grep -v "Artifacts" | head -n 1)
          
          if [ -n "$APP_PATH" ]; then
            echo "Megtalált .app mappa: $APP_PATH"
            cp -r "$APP_PATH" Payload/
          else
            echo "Hiba: Nem található generált iOS .app fájl!"
            exit 1
          fi
          
          # Becsomagoljuk az IPA-t a gyökérkönyvtárba
          zip -r ../sideload_app.ipa Payload

      # 4. LÉPÉS: Az IPA fájl feltöltése a GitHub felületére
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-ios-sideload-ipa
          path: sideload_app.ipa
