name: Build iOS for Sideload
on:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    defaults:
      run:
        # Kényszerítjük, hogy minden parancs a desktop-tauri mappában fusson
        working-directory: desktop-tauri

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install dependencies
        run: npm install

      # Tauri iOS app fordítása kódaláírás nélkül
      - name: Build Tauri App for iOS
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGN_IDENTITY: ""
          PROVISIONING_PROFILE_SPECIFIER: ""
        with:
          # Megmondjuk a Tauri Action-nek is, hogy hol találja a projektet
          projectPath: desktop-tauri
          args: --target aarch64-apple-ios

      # Automatikus IPA generálás a Sideloadly számára
      - name: Package IPA for Sideloadly
        run: |
          mkdir -p Payload
          # Átmásoljuk a generált .app fájlt a Payload mappába
          cp -r src-tauri/gen/apple/build/arm64/*.app Payload/
          # Becsomagoljuk ZIP-be, majd átnevezzük .ipa kiterjesztésre
          zip -r ../sideload_app.ipa Payload
        # Ez a lépés egy szinttel feljebb menti az IPA-t a gyökérbe

      # A kész IPA fájl feltöltése a GitHub Actions futási naplójához letölthetőként
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-ios-sideload-ipa
          path: sideload_app.ipa
