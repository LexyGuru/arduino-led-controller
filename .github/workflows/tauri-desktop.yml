name: Tauri desktop build and release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop-tauri/**"
      - ".github/workflows/tauri-desktop.yml"

# A build jobok csak olvasnak, a külön release job kap írási jogot.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Tauri alkalmazás
            os: ubuntu-22.04
            bundles: appimage,deb
            artifact_name: arduino-led-controller-linux
          - name: macOS Tauri alkalmazás
            os: macos-latest
            bundles: dmg
            artifact_name: arduino-led-controller-macos
          - name: Windows Tauri alkalmazás
            os: windows-latest
            bundles: nsis
            artifact_name: arduino-led-controller-windows

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: desktop-tauri

    steps:
      - name: Forrás letöltése
        uses: actions/checkout@v4

      - name: Projektfájlok ellenőrzése
        shell: bash
        run: |
          pwd
          ls -la
          test -f package.json || { echo "HIBA: desktop-tauri/package.json nem található."; exit 1; }
          test -f src-tauri/tauri.conf.json || { echo "HIBA: desktop-tauri/src-tauri/tauri.conf.json nem található."; exit 1; }

      - name: Node.js telepítése
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rust telepítése
        uses: dtolnay/rust-toolchain@stable

      - name: Linux rendszerkönyvtárak
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Frontend függőségek telepítése
        run: npm install --no-audit --no-fund

      - name: Frontend ellenőrzése
        run: npm run build

      - name: Rust backend ellenőrzése
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust egységtesztek
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      # FONTOS: itt nincs tagName/releaseName/releaseId.
      # Ez a lépés csak fordít; nem próbál GitHub Release-t létrehozni.
      - name: Tauri alkalmazás fordítása
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop-tauri
          args: --bundles ${{ matrix.bundles }}

      - name: Linux csomagok feltöltése workflow artifactként
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            desktop-tauri/src-tauri/target/release/bundle/deb/*
            desktop-tauri/src-tauri/target/release/bundle/appimage/*

      - name: macOS csomagok feltöltése workflow artifactként
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            desktop-tauri/src-tauri/target/release/bundle/dmg/*

      - name: Windows csomagok feltöltése workflow artifactként
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            desktop-tauri/src-tauri/target/release/bundle/nsis/*

  release:
    name: GitHub Release létrehozása
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Forrás letöltése
        uses: actions/checkout@v4

      - name: Elkészült csomagok letöltése
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verzió beolvasása
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./desktop-tauri/src-tauri/tauri.conf.json').version")
          if [ -z "$VERSION" ]; then
            echo "HIBA: a Tauri verzió nem olvasható ki."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=tauri-v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release verzió: $VERSION"

      - name: Release-fájlok ellenőrzése
        shell: bash
        run: |
          find release-assets -type f -maxdepth 5 -print
          COUNT=$(find release-assets -type f | wc -l | tr -d ' ')
          if [ "$COUNT" -lt 4 ]; then
            echo "HIBA: túl kevés telepítőcsomag készült: $COUNT"
            exit 1
          fi

      - name: GitHub Release létrehozása vagy frissítése
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -d '' FILES < <(find release-assets -type f -print0)

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A $TAG release már létezik; fájlok frissítése."
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            echo "Új release létrehozása: $TAG"
            gh release create "$TAG" "${FILES[@]}" \
              --target "$GITHUB_SHA" \
              --title "Arduino LED Controller v$VERSION" \
              --notes "Automatikusan fordított Tauri desktop kiadás macOS, Windows és Linux rendszerekhez."
          fi
