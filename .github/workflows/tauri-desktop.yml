name: Tauri desktop build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "index.html"
      - ".github/workflows/build-desktop.yml"

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Tauri alkalmazás
            os: ubuntu-22.04
          - name: macOS Tauri alkalmazás
            os: macos-latest
          - name: Windows Tauri alkalmazás
            os: windows-latest

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Forrás letöltése
        uses: actions/checkout@v4

      - name: Projektfájlok ellenőrzése
        shell: bash
        run: |
          echo "Repository gyökér: $GITHUB_WORKSPACE"
          pwd
          ls -la
          test -f package.json || { echo "HIBA: package.json nincs a repository gyökerében."; exit 1; }
          test -f src-tauri/tauri.conf.json || { echo "HIBA: src-tauri/tauri.conf.json nem található."; exit 1; }

      - name: Node.js telepítése cache nélkül
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ""

      - name: Rust telepítése
        uses: dtolnay/rust-toolchain@stable

      - name: Linux rendszerkönyvtárak
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Frontend függőségek telepítése
        run: npm install --no-audit --no-fund

      - name: Frontend ellenőrzése
        run: npm run build

      - name: Tauri alkalmazás fordítása
        uses: tauri-apps/tauri-action@v0

      - name: Linux csomagok feltöltése
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: arduino-led-controller-linux
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*
            src-tauri/target/release/bundle/appimage/*

      - name: macOS csomagok feltöltése
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: arduino-led-controller-macos
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*
            src-tauri/target/release/bundle/macos/*

      - name: Windows csomagok feltöltése
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: arduino-led-controller-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/release/bundle/nsis/*
