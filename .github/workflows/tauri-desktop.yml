name: Natív asztali alkalmazás kiadás

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "desktop-tauri/**"
      - ".github/workflows/tauri-desktop.yml"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }} Tauri alkalmazás

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --bundles dmg

          - name: Windows
            os: windows-latest
            args: --bundles nsis

          - name: Linux
            os: ubuntu-22.04
            args: --bundles appimage,deb

    runs-on: ${{ matrix.os }}

    steps:
      - name: Repository letöltése
        uses: actions/checkout@v5

      - name: Node.js telepítése
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Rust telepítése
        uses: dtolnay/rust-toolchain@stable

      - name: Linux rendszerfüggőségek telepítése
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Node.js csomagok telepítése
        working-directory: desktop-tauri
        shell: bash
        run: npm install

      - name: Verziók ellenőrzése
        working-directory: desktop-tauri
        shell: bash
        run: |
          echo "package.json verzió:"
          node -p "require('./package.json').version"

          echo "tauri.conf.json verzió:"
          node -e "const c=require('./src-tauri/tauri.conf.json'); console.log(c.version)"

          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -e "const c=require('./src-tauri/tauri.conf.json'); process.stdout.write(c.version)")

          if [ "$PACKAGE_VERSION" != "$TAURI_VERSION" ]; then
            echo "::error::A package.json és a tauri.conf.json verziója eltér."
            echo "::error::package.json: $PACKAGE_VERSION"
            echo "::error::tauri.conf.json: $TAURI_VERSION"
            exit 1
          fi

      - name: Tauri alkalmazás fordítása és kiadása
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop-tauri
          tagName: tauri-v__VERSION__
          releaseName: Arduino LED Controller v__VERSION__
          releaseBody: |
            Arduino LED Controller natív Tauri alkalmazás.

            Letölthető változatok:
            - macOS DMG
            - Windows NSIS telepítő
            - Linux AppImage és DEB

            Az alkalmazás verziója a desktop-tauri/package.json és
            desktop-tauri/src-tauri/tauri.conf.json fájlokból származik.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
