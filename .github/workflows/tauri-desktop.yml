name: Legacy Tauri Stable Release Wrapper

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Delegate to canonical Application Stable release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  delegate:
    uses: ./.github/workflows/app-stable-release.yml
    with:
      publish: ${{ inputs.publish }}
    secrets: inherit
