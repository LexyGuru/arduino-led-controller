name: Application Beta release (legacy entry)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the GitHub prerelease after every build succeeds
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: v55-beta-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  EXPECTED_BRANCH: next/v5-rearchitecture
  EXPECTED_VERSION: 5.6.1-beta.1

jobs:
  validate:
    name: Beta release gate
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      doc_prefix: ${{ steps.version.outputs.doc_prefix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Verify release branch and version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}" || {
            echo "::error::A Beta release csak a ${EXPECTED_BRANCH} ágról indítható."
            exit 1
          }
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test "${VERSION}" = "${EXPECTED_VERSION}" || {
            echo "::error::Elvárt verzió: ${EXPECTED_VERSION}; tényleges: ${VERSION}"
            exit 1
          }
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

          if [[ "${VERSION}" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+-beta\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            BETA_NUMBER="${BASH_REMATCH[3]}"
          else
            echo "::error::Nem támogatott Beta verzióformátum: ${VERSION}"
            exit 1
          fi

          if [ "${MAJOR}" = "5" ] && [ "${MINOR}" = "0" ]; then
            DOC_PREFIX="BETA${BETA_NUMBER}"
          else
            DOC_PREFIX="V${MAJOR}${MINOR}_BETA${BETA_NUMBER}"
          fi

          echo "doc_prefix=${DOC_PREFIX}" >> "${GITHUB_OUTPUT}"
          echo "Release documentation prefix: ${DOC_PREFIX}"

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install desktop dependencies
        working-directory: desktop-tauri
        run: npm ci --no-audit --no-fund

      - name: Verify synchronized versions
        run: python3 scripts/check-versions.py

      - name: Verify Beta distribution contracts
        run: |
          node scripts/test-beta-release-workflow.js
          npm run test:beta-installation-assets

      - name: Enforce immutable macOS OTA Beta.7 contract
        run: npm run test:macos-ota-immutable

      - name: Run full Node regression suite
        run: npm test

      - name: Validate repository
        run: bash scripts/validate-repository.sh

      - name: Build desktop frontend
        working-directory: desktop-tauri
        run: npm run build

      - name: Check Rust backend
        run: RUSTFLAGS="-D warnings" cargo check --locked --manifest-path desktop-tauri/src-tauri/Cargo.toml

      - name: Test Rust backend
        run: RUSTFLAGS="-D warnings" cargo test --locked --manifest-path desktop-tauri/src-tauri/Cargo.toml

  build-desktop:
    name: ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04
            key: linux-x86_64
            args: --bundles appimage,deb
            target: ""
          - name: Windows x86_64
            os: windows-latest
            key: windows-x86_64
            args: --bundles nsis
            target: ""
          - name: macOS Apple Silicon
            os: macos-15
            key: macos-apple-silicon
            args: --target aarch64-apple-darwin --bundles dmg,app
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-15-intel
            key: macos-intel
            args: --target x86_64-apple-darwin --bundles dmg,app
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop-tauri
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add explicit Rust target
        if: matrix.target != ''
        run: rustup target add "${{ matrix.target }}"

      - name: Install Linux system dependencies
        if: matrix.key == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Test Rust library
        run: RUSTFLAGS="-D warnings" cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Verify Tauri updater signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}" || { echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY"; exit 1; }
          test -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" || { echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD"; exit 1; }

      - name: Build Tauri installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: desktop-tauri
          args: ${{ matrix.args }}

      - name: Collect normalized installer files
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          PLATFORM_KEY: ${{ matrix.key }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          case "${PLATFORM_KEY}" in
            linux-x86_64)
              APPIMAGE="$(find src-tauri/target -type f -path '*/bundle/appimage/*.AppImage' -print | sort | tail -n 1)"
              DEB="$(find src-tauri/target -type f -path '*/bundle/deb/*.deb' -print | sort | tail -n 1)"
              test -f "${APPIMAGE}"
              test -f "${DEB}"
              APPIMAGE_SIG="${APPIMAGE}.sig"
              test -f "${APPIMAGE_SIG}"
              cp "${APPIMAGE}" "artifacts/Arduino_LED_Controller_${VERSION}_Linux_x86_64.AppImage"
              cp "${APPIMAGE_SIG}" "artifacts/Arduino_LED_Controller_${VERSION}_Linux_x86_64.AppImage.sig"
              cp "${DEB}" "artifacts/Arduino_LED_Controller_${VERSION}_Linux_x86_64.deb"
              ;;
            windows-x86_64)
              EXE="$(find src-tauri/target -type f -path '*/bundle/nsis/*.exe' -print | sort | tail -n 1)"
              test -f "${EXE}"
              EXE_SIG="${EXE}.sig"
              test -f "${EXE_SIG}"
              cp "${EXE}" "artifacts/Arduino_LED_Controller_${VERSION}_Windows_x86_64_Setup.exe"
              cp "${EXE_SIG}" "artifacts/Arduino_LED_Controller_${VERSION}_Windows_x86_64_Setup.exe.sig"
              ;;
            macos-apple-silicon)
              DMG="$(find src-tauri/target -type f -path '*/bundle/dmg/*.dmg' -print | sort | tail -n 1)"
              test -n "${DMG}" && test -f "${DMG}" || { echo "::error::MACOS_DMG=MISSING (${PLATFORM_KEY})"; exit 1; }
              APP_TAR="$(find src-tauri/target -type f -path '*/bundle/macos/*.app.tar.gz' -print | sort | tail -n 1)"
              APP_TAR_SIG="${APP_TAR}.sig"
              test -n "${APP_TAR}" && test -f "${APP_TAR}" || { echo "::error::MACOS_UPDATER_TAR=MISSING (${PLATFORM_KEY})"; exit 1; }
              echo "MACOS_UPDATER_TAR=FOUND (${PLATFORM_KEY})"
              test -f "${APP_TAR_SIG}" || { echo "::error::MACOS_UPDATER_SIGNATURE=MISSING (${PLATFORM_KEY})"; exit 1; }
              echo "MACOS_UPDATER_SIGNATURE=FOUND (${PLATFORM_KEY})"
              cp "${DMG}" "artifacts/Arduino_LED_Controller_${VERSION}_macOS_Apple_Silicon.dmg"
              cp "${APP_TAR}" "artifacts/Arduino_LED_Controller_${VERSION}_macOS_Apple_Silicon.app.tar.gz"
              cp "${APP_TAR_SIG}" "artifacts/Arduino_LED_Controller_${VERSION}_macOS_Apple_Silicon.app.tar.gz.sig"
              ;;
            macos-intel)
              DMG="$(find src-tauri/target -type f -path '*/bundle/dmg/*.dmg' -print | sort | tail -n 1)"
              test -n "${DMG}" && test -f "${DMG}" || { echo "::error::MACOS_DMG=MISSING (${PLATFORM_KEY})"; exit 1; }
              APP_TAR="$(find src-tauri/target -type f -path '*/bundle/macos/*.app.tar.gz' -print | sort | tail -n 1)"
              APP_TAR_SIG="${APP_TAR}.sig"
              test -n "${APP_TAR}" && test -f "${APP_TAR}" || { echo "::error::MACOS_UPDATER_TAR=MISSING (${PLATFORM_KEY})"; exit 1; }
              echo "MACOS_UPDATER_TAR=FOUND (${PLATFORM_KEY})"
              test -f "${APP_TAR_SIG}" || { echo "::error::MACOS_UPDATER_SIGNATURE=MISSING (${PLATFORM_KEY})"; exit 1; }
              echo "MACOS_UPDATER_SIGNATURE=FOUND (${PLATFORM_KEY})"
              cp "${DMG}" "artifacts/Arduino_LED_Controller_${VERSION}_macOS_Intel.dmg"
              cp "${APP_TAR}" "artifacts/Arduino_LED_Controller_${VERSION}_macOS_Intel.app.tar.gz"
              cp "${APP_TAR_SIG}" "artifacts/Arduino_LED_Controller_${VERSION}_macOS_Intel.app.tar.gz.sig"
              ;;
            *)
              echo "::error::Ismeretlen platform: ${PLATFORM_KEY}"
              exit 1
              ;;
          esac
          find artifacts -maxdepth 1 -type f -print

      - name: Upload desktop installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: beta-${{ matrix.key }}
          path: desktop-tauri/artifacts/*
          if-no-files-found: error
          retention-days: 30

  build-android:
    name: Android APK and AAB
    needs: validate
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
        working-directory: desktop-tauri
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Tauri CLI
        run: npm install --no-save --package-lock=false @tauri-apps/cli@2.11.4

      - name: Initialize Android project
        run: |
          set -euo pipefail
          if [ ! -d src-tauri/gen/android ]; then
            npx tauri android init --ci
          fi
          test -f src-tauri/gen/android/gradlew
          chmod +x src-tauri/gen/android/gradlew

      - name: Generate V5 Android launcher icons
        run: bash ../scripts/generate-v5-mobile-icons.sh

      - name: Configure Android release signing when available
        id: signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEY_BASE64:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "signed=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Android signing secrets are missing. A debug APK and unsigned AAB will be published."
            exit 0
          fi
          KEYSTORE="${RUNNER_TEMP}/arduino-led-controller-upload.jks"
          printf '%s' "${ANDROID_KEY_BASE64}" | base64 --decode > "${KEYSTORE}"
          chmod 600 "${KEYSTORE}"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          keyAlias=${ANDROID_KEY_ALIAS}
          password=${ANDROID_KEY_PASSWORD}
          storeFile=${KEYSTORE}
          EOF
          python3 <<'PY'
          from pathlib import Path
          import re
          path = Path("src-tauri/gen/android/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          if "import java.util.Properties" not in text:
              text = "import java.util.Properties\nimport java.io.FileInputStream\n" + text
          signing_block = '''
              signingConfigs {
                  create("release") {
                      val keystorePropertiesFile = rootProject.file("keystore.properties")
                      val keystoreProperties = Properties()
                      if (keystorePropertiesFile.exists()) {
                          keystoreProperties.load(FileInputStream(keystorePropertiesFile))
                      }
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["password"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["password"] as String
                  }
              }
          '''
          if 'create("release")' not in text:
              marker = "    buildTypes {"
              if marker not in text:
                  raise SystemExit("Missing buildTypes block")
              text = text.replace(marker, signing_block + marker, 1)
          if 'signingConfig = signingConfigs.getByName("release")' not in text:
              for pattern in [r'(getByName\("release"\)\s*\{)', r'(release\s*\{)']:
                  updated, count = re.subn(
                      pattern,
                      r'\1\n            signingConfig = signingConfigs.getByName("release")',
                      text,
                      count=1,
                  )
                  if count:
                      text = updated
                      break
              else:
                  raise SystemExit("Missing release build type")
          path.write_text(text, encoding="utf-8")
          PY
          echo "signed=true" >> "${GITHUB_OUTPUT}"

      - name: Build signed Android release packages
        if: steps.signing.outputs.signed == 'true'
        run: |
          npx tauri android build --ci --apk
          npx tauri android build --ci --aab

      - name: Build debug APK and unsigned AAB
        if: steps.signing.outputs.signed != 'true'
        run: |
          npx tauri android build --ci --debug --apk
          npx tauri android build --ci --aab

      - name: Collect Android packages
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [ "${SIGNED}" = "true" ]; then
            APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' ! -name '*unsigned*' -print | sort | tail -n 1)"
            AAB="$(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' -print | sort | tail -n 1)"
            APK_OUT="artifacts/Arduino_LED_Controller_${VERSION}_Android.apk"
            AAB_OUT="artifacts/Arduino_LED_Controller_${VERSION}_Android.aab"
          else
            APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*debug*.apk' -print | sort | tail -n 1)"
            AAB="$(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' -print | sort | tail -n 1)"
            APK_OUT="artifacts/Arduino_LED_Controller_${VERSION}_Android_debug.apk"
            AAB_OUT="artifacts/Arduino_LED_Controller_${VERSION}_Android_unsigned.aab"
          fi
          test -f "${APK}"
          test -f "${AAB}"
          cp "${APK}" "${APK_OUT}"
          cp "${AAB}" "${AAB_OUT}"
          find artifacts -maxdepth 1 -type f -print

      - name: Upload Android artifact
        uses: actions/upload-artifact@v6
        with:
          name: beta-android
          path: desktop-tauri/artifacts/*
          if-no-files-found: error
          retention-days: 30

  build-ios:
    name: Unsigned iOS and iPadOS IPA
    needs: validate
    runs-on: macos-15
    defaults:
      run:
        shell: bash
        working-directory: desktop-tauri
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Remove unused untrusted Homebrew tap
        run: brew untap aws/tap || true

      - name: Set up Rust iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Tauri CLI
        run: npm install --no-save --package-lock=false @tauri-apps/cli@2.11.4

      - name: Initialize iOS project
        run: |
          if [ ! -d src-tauri/gen/apple ]; then
            npx tauri ios init --ci
          fi

      - name: Generate V5 iOS and iPadOS app icons
        run: bash ../scripts/generate-v5-mobile-icons.sh

      - name: Build unsigned IPA
        run: npx tauri ios build --ci --no-sign

      - name: Collect unsigned IPA
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          IPA="$(find src-tauri/gen/apple -type f -name '*.ipa' -print | sort | tail -n 1)"
          test -f "${IPA}"
          mkdir -p artifacts
          cp "${IPA}" "artifacts/Arduino_LED_Controller_${VERSION}_iOS_iPadOS_unsigned.ipa"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: beta-ios-unsigned
          path: desktop-tauri/artifacts/*
          if-no-files-found: error
          retention-days: 30

  build-lxc:
    name: Debian and Proxmox LXC server bundle
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build versioned Beta LXC bundle
        env:
          OUTPUT_DIR: ${{ github.workspace }}/artifacts
          OUTPUT_BASENAME: Arduino_LED_Controller_${{ needs.validate.outputs.version }}_LXC_Server
        run: bash deploy/build-beta-release-bundle.sh

      - name: Upload LXC artifact
        uses: actions/upload-artifact@v6
        with:
          name: beta-lxc-server
          path: artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub prerelease
    if: ${{ inputs.publish }}
    needs:
      - validate
      - build-desktop
      - build-android
      - build-ios
      - build-lxc
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Add installation assets and release documentation
        env:
          DOC_PREFIX: ${{ needs.validate.outputs.doc_prefix }}
        run: |
          set -euo pipefail
          cp release-versions.json release-assets/
          cp "docs/v5/${DOC_PREFIX}_INSTALLATION_GUIDE.md" release-assets/
          cp "docs/v5/${DOC_PREFIX}_RELEASE_NOTES.md" release-assets/
          cp "docs/v5/${DOC_PREFIX}_RELEASE_CHECKLIST.md" release-assets/
          test -f "release-assets/${DOC_PREFIX}_INSTALLATION_GUIDE.md"
          test -f "release-assets/${DOC_PREFIX}_RELEASE_NOTES.md"
          test -f "release-assets/${DOC_PREFIX}_RELEASE_CHECKLIST.md"
          cp deploy/install-beta-lxc.sh release-assets/
          cp deploy/beta-lxc.env.example release-assets/
          chmod 0755 release-assets/install-beta-lxc.sh

      - name: Verify expected release asset classes
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release-assets -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')" -eq 2
          test "$(find release-assets -maxdepth 1 -type f -name '*.exe' | wc -l | tr -d ' ')" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*.AppImage' | wc -l | tr -d ' ')" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*.deb' | wc -l | tr -d ' ')" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*.apk' | wc -l | tr -d ' ')" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*.aab' | wc -l | tr -d ' ')" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*.ipa' | wc -l | tr -d ' ')" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*.bin' | wc -l | tr -d ' ')" -eq 0
          test "$(find release-assets -maxdepth 1 -type f -name '*.bin.sha256' | wc -l | tr -d ' ')" -eq 0
          test -f release-assets/release-versions.json
          node -e "const r=require('./release-assets/release-versions.json'); if(r.application!==process.env.EXPECTED_VERSION) process.exit(1)"
          test "$(find release-assets -maxdepth 1 -type f -name '*_LXC_Server.tar.gz' | wc -l | tr -d ' ')" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*.app.tar.gz' | wc -l | tr -d ' ')" -eq 2
          test "$(find release-assets -maxdepth 1 -type f -name '*.sig' | wc -l | tr -d ' ')" -eq 4
          find release-assets -maxdepth 1 -type f -print | sort

      - name: Generate Tauri updater static feed
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("release-assets")
          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          base = f"https://github.com/LexyGuru/arduino-led-controller/releases/download/{tag}"
          assets = {
              "linux-x86_64": (
                  f"Arduino_LED_Controller_{version}_Linux_x86_64.AppImage",
                  f"Arduino_LED_Controller_{version}_Linux_x86_64.AppImage.sig",
              ),
              "windows-x86_64": (
                  f"Arduino_LED_Controller_{version}_Windows_x86_64_Setup.exe",
                  f"Arduino_LED_Controller_{version}_Windows_x86_64_Setup.exe.sig",
              ),
              "darwin-aarch64": (
                  f"Arduino_LED_Controller_{version}_macOS_Apple_Silicon.app.tar.gz",
                  f"Arduino_LED_Controller_{version}_macOS_Apple_Silicon.app.tar.gz.sig",
              ),
              "darwin-x86_64": (
                  f"Arduino_LED_Controller_{version}_macOS_Intel.app.tar.gz",
                  f"Arduino_LED_Controller_{version}_macOS_Intel.app.tar.gz.sig",
              ),
          }
          platforms = {}
          for platform, (artifact, signature_file) in assets.items():
              artifact_path = root / artifact
              signature_path = root / signature_file
              if not artifact_path.is_file():
                  raise SystemExit(f"Missing updater artifact: {artifact}")
              if not signature_path.is_file():
                  raise SystemExit(f"Missing updater signature: {signature_file}")
              signature = signature_path.read_text(encoding="utf-8").strip()
              if not signature:
                  raise SystemExit(f"Empty updater signature: {signature_file}")
              platforms[platform] = {
                  "url": f"{base}/{artifact}",
                  "signature": signature,
              }
          latest = {
              "version": version,
              "notes": "Arduino LED Controller Beta signed native application update.",
              "platforms": platforms,
          }
          (root / "latest.json").write_text(
              json.dumps(latest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
          test -f release-assets/latest.json

      - name: Generate supply-chain evidence
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          node scripts/generate-release-sbom.js \
            --root "${GITHUB_WORKSPACE}" \
            --output "${GITHUB_WORKSPACE}/release-assets/SBOM.cdx.json" \
            --version "${{ needs.validate.outputs.version }}" \
            --commit "${GITHUB_SHA}"
          node scripts/generate-release-provenance.js \
            --root "${GITHUB_WORKSPACE}" \
            --output "${GITHUB_WORKSPACE}/release-assets/PROVENANCE.json" \
            --commit "${GITHUB_SHA}" \
            --phase beta
          node scripts/scan-release-secrets.js \
            --root "${GITHUB_WORKSPACE}/release-assets" \
            --output "${GITHUB_WORKSPACE}/release-assets/SECRET-SCAN.json"

      - name: Generate checksums and machine-readable manifest
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name RELEASE-MANIFEST.json -printf '%f\0' \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("release-assets")
          files = []
          for path in sorted(root.iterdir(), key=lambda item: item.name):
              if not path.is_file() or path.name == "RELEASE-MANIFEST.json":
                  continue
              payload = path.read_bytes()
              files.append({
                  "name": path.name,
                  "bytes": len(payload),
                  "sha256": hashlib.sha256(payload).hexdigest(),
              })

          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          versions = json.loads(Path("release-versions.json").read_text(encoding="utf-8"))
          manifest = {
              "schemaVersion": 2,
              "product": "Arduino LED Controller",
              "version": version,
              "tag": tag,
              "commit": os.environ["GITHUB_SHA"],
              "channel": "beta",
              "prerelease": True,
              "productionDeploymentIncluded": False,
              "compatibility": {
                  "board": "arduino-uno-r4-wifi",
                  "directApiVersion": "1.0.0",
                  "applicationVersion": version,
              },
              "files": files,
          }
          (root / "RELEASE-MANIFEST.json").write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          base_url = f"https://github.com/LexyGuru/arduino-led-controller/releases/download/{tag}"
          app_assets = {
              "windows-x86_64": f"Arduino_LED_Controller_{version}_Windows_x86_64_Setup.exe",
              "linux-x86_64-appimage": f"Arduino_LED_Controller_{version}_Linux_x86_64.AppImage",
              "linux-x86_64-deb": f"Arduino_LED_Controller_{version}_Linux_x86_64.deb",
              "macos-aarch64": f"Arduino_LED_Controller_{version}_macOS_Apple_Silicon.dmg",
              "macos-x86_64": f"Arduino_LED_Controller_{version}_macOS_Intel.dmg",
          }
          latest = {
              "schemaVersion": 1,
              "channel": "beta",
              "publishedAt": os.environ.get("GITHUB_RUN_ID", "github-actions"),
              "app": {
                  "version": version,
                  "directApiVersion": "1.0.0",
                  "releaseUrl": f"https://github.com/LexyGuru/arduino-led-controller/releases/tag/{tag}",
                  "artifacts": {key: {"name": name, "url": f"{base_url}/{name}"} for key, name in app_assets.items()},
              },
          }
          (root / "latest-beta.json").write_text(
              json.dumps(latest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Enforce application-only release assets
        run: |
          set -euo pipefail
          if find release-assets -maxdepth 1 -type f \( -name 'Arduino_LED_Controller_Firmware_*' -o -name 'firmware-release.json' -o -name 'firmware-catalog.json' \) | grep -q .; then
            echo "::error::Firmware asset nem kerülhet az alkalmazás Beta prerelease-be."
            exit 1
          fi

      - name: Remove stale historical release documentation assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            for generation in 1 2 3 4 5 6 7 8; do
              for kind in INSTALLATION_GUIDE RELEASE_NOTES RELEASE_CHECKLIST; do
                name="BETA${generation}_${kind}.md"
                asset_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq ".assets[] | select(.name==\"${name}\") | .id" | head -n 1)"
                if [ -n "${asset_id}" ]; then
                  gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
                fi
              done
            done
          fi

      - name: Publish or update prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Arduino LED Controller ${{ needs.validate.outputs.version }}
          body_path: docs/v5/${{ needs.validate.outputs.doc_prefix }}_RELEASE_NOTES.md
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: release-assets/*

      - name: Publish beta updater feed alias
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view updater-beta >/dev/null 2>&1; then
            gh release upload updater-beta release-assets/latest.json --clobber
          else
            gh release create updater-beta release-assets/latest.json \
              --target "${GITHUB_SHA}" \
              --title "Arduino LED Controller Beta Updater Feed" \
              --notes "Machine-readable signed Beta updater feed. Use the versioned prerelease for human downloads." \
              --prerelease
          fi

      - name: Verify beta updater feed alias
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          gh release download updater-beta --pattern latest.json --dir "${TMP}" --clobber
          node -e "const f=require('fs');const j=JSON.parse(f.readFileSync(process.argv[1],'utf8'));if(j.version!==process.env.VERSION)process.exit(1);for(const k of ['linux-x86_64','windows-x86_64','darwin-aarch64','darwin-x86_64']){if(!j.platforms?.[k]?.url||!j.platforms?.[k]?.signature)process.exit(2)}" "${TMP}/latest.json"

      - name: Verify published prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "${TAG}" --json isPrerelease,targetCommitish,assets \
            --jq '{isPrerelease,targetCommitish,assetCount:(.assets|length),assets:[.assets[].name]}'
          test "$(gh release view "${TAG}" --json isPrerelease --jq '.isPrerelease')" = "true"
          test "$(gh release view "${TAG}" --json assets --jq '.assets | length')" -ge 18


      - name: Upload complete release set as workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: beta-complete-release-set
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
