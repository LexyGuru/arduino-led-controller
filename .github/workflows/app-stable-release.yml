              rc=$?
              set -e
              if [ "$rc" -eq 0 ]; then
                [ -n "$output" ] && printf '%s\n' "$output"
                return 0
              fi
              if printf '%s\n' "$output" | grep -Eq 'HTTP 5[0-9][0-9]|No server is currently available|Bad Gateway|Service Unavailable|502|503|504'; then
                if [ "$n" -ge 8 ]; then
                  printf '%s\n' "$output" >&2
                  return "$rc"
                fi
