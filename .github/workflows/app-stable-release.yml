name: Application Stable release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the Stable application release after all builds succeed
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      publish:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Stable application release gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Enforce Stable branch/channel contract
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "main"
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          node -e "const r=require('./release-versions.json'); if(r.schemaVersion!==2||r.applicationRelease?.channel!=='stable'||r.applicationRelease?.branch!=='main'||r.applicationRelease?.updaterAlias!=='updater-stable') process.exit(1)"
      - run: npm ci --no-audit --no-fund
      - run: npm run test:release-architecture-v2
      - run: npm run test:release-workflow-architecture-v2
      - run: npm test
      - run: npm run validate

  release-permission-preflight:
    name: Stable release permission and signing preflight
    needs: validate
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Verify signing secrets before expensive builds
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}" || { echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY"; exit 1; }
          test -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" || { echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD"; exit 1; }
      - name: Verify dedicated release publishing token before expensive builds
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || {
            echo "::error::Missing RELEASE_PUBLISH_TOKEN. Stable publishing requires a dedicated token with repository Contents: write permission."
            exit 1
          }
          retry_gh() {
            local n=1 delay=5
            while true; do
              local output rc
              set +e
              output="$("$@" 2>&1)"
              rc=$?
              set -e
              if [ "$rc" -eq 0 ]; then
                [ -n "$output" ] && printf '%s\n' "$output"
                return 0
              fi
              if printf '%s\n' "$output" | grep -Eq 'HTTP 5[0-9][0-9]|No server is currently available|Bad Gateway|Service Unavailable|502|503|504'; then
                if [ "$n" -ge 8 ]; then
                  printf '%s\n' "$output" >&2
                  return "$rc"
                fi
                echo "RETRY ${n}/8: transient GitHub/API failure, waiting ${delay}s..." >&2
                sleep "$delay"
                n=$((n + 1))
                delay=$((delay * 2))
                [ "$delay" -gt 40 ] && delay=40
                continue
              fi
              printf '%s\n' "$output" >&2
              return "$rc"
            done
          }
          VERSION="$(tr -d '[:space:]' < VERSION)"
          retry_gh gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="v${VERSION}" \
            -f target_commitish="${GITHUB_SHA}" \
            >/dev/null
          echo "STABLE_RELEASE_WRITE_PERMISSION_PREFLIGHT=PASSED"

  app-build:
    name: Build all Stable application artifacts
    needs:
      - validate
      - release-permission-preflight
    uses: ./.github/workflows/app-build.yml
    secrets: inherit

  publish:
    name: Stable application GitHub Release
    if: ${{ inputs.publish }}
    needs:
      - validate
      - release-permission-preflight
      - app-build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Enforce application-only Stable release assets
        shell: bash
        run: |
          set -euo pipefail
          if find release-assets -type f \( -name '*.bin' -o -name '*.bin.sha256' -o -name 'firmware-release.json' -o -name 'firmware-catalog.json' -o -name 'Arduino_LED_Controller_Firmware_*' \) | grep -q .; then
            echo "::error::Firmware artifact must not be published by Application Stable release."
            exit 1
          fi

      - name: Forrás letöltése
        uses: actions/checkout@v5

      - name: Összes elkészült csomag letöltése
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Enforce downloaded Stable application-only assets
        shell: bash
        run: |
          set -euo pipefail
          if find release-assets -type f \( -name '*.bin' -o -name '*.bin.sha256' -o -name 'firmware-release.json' -o -name 'firmware-catalog.json' -o -name 'Arduino_LED_Controller_Firmware_*' \) | grep -q .; then
            echo "::error::Firmware artifact must not be published by Application Stable release."
            exit 1
          fi

      - name: Verzió beolvasása
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./desktop-tauri/src-tauri/tauri.conf.json').version")"
          test -n "$VERSION" || { echo "HIBA: a Tauri verzió nem olvasható ki."; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Release-fájlok ellenőrzése
        shell: bash
        run: |
          set -euo pipefail

          find release-assets -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.ipa' -o -name '*.apk' -o -name '*.aab' -o -name '*.app.tar.gz' -o -name '*.sig' -o -name 'latest.json' \) \
            -print

          COUNT="$(find release-assets -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.ipa' -o -name '*.apk' -o -name '*.aab' -o -name '*.app.tar.gz' -o -name '*.sig' -o -name 'latest.json' \) \
            | wc -l | tr -d ' ')"

          if [ "$COUNT" -lt 7 ]; then
            echo "HIBA: túl kevés kiadási csomag készült: $COUNT; legalább 7 szükséges."
            exit 1
          fi

          test "$(find release-assets -type f -name '*.ipa' | wc -l | tr -d ' ')" -eq 1 || { echo "HIBA: pontosan egy IPA szükséges."; exit 1; }
          test "$(find release-assets -type f -name '*.apk' | wc -l | tr -d ' ')" -ge 1 || { echo "HIBA: hiányzik az Android APK."; exit 1; }
          test "$(find release-assets -type f -name '*.aab' | wc -l | tr -d ' ')" -ge 1 || { echo "HIBA: hiányzik az Android AAB."; exit 1; }

      - name: Generate signed Stable updater feed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path("release-assets")
          version=json.loads(Path("desktop-tauri/src-tauri/tauri.conf.json").read_text())["version"]
          base=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/v{version}"
          specs={
            "linux-x86_64":(f"Arduino_LED_Controller_{version}_Linux_x86_64.AppImage",f"Arduino_LED_Controller_{version}_Linux_x86_64.AppImage.sig"),
            "windows-x86_64":(f"Arduino_LED_Controller_{version}_Windows_x86_64_Setup.exe",f"Arduino_LED_Controller_{version}_Windows_x86_64_Setup.exe.sig"),
            "darwin-aarch64":(f"Arduino_LED_Controller_{version}_macOS_Apple_Silicon.app.tar.gz",f"Arduino_LED_Controller_{version}_macOS_Apple_Silicon.app.tar.gz.sig"),
            "darwin-x86_64":(f"Arduino_LED_Controller_{version}_macOS_Intel.app.tar.gz",f"Arduino_LED_Controller_{version}_macOS_Intel.app.tar.gz.sig"),
          }
          platforms={}
          for platform,(artifact,sigfile) in specs.items():
            ap=root/artifact; sp=root/sigfile
            if not ap.is_file(): raise SystemExit(f"Missing updater artifact: {artifact}")
            if not sp.is_file(): raise SystemExit(f"Missing updater signature: {sigfile}")
            sig=sp.read_text(encoding="utf-8").strip()
            if not sig: raise SystemExit(f"Empty updater signature: {sigfile}")
            platforms[platform]={"url":f"{base}/{artifact}","signature":sig}
          latest={"version":version,"notes":"Arduino LED Controller Stable signed native application update.","platforms":platforms}
          (root/"latest.json").write_text(json.dumps(latest,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          PY
          echo "STABLE_SIGNED_UPDATER_FEED=GENERATED"

      - name: GitHub Release létrehozása vagy frissítése
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          retry_gh() {
            local n=1 delay=5
            while true; do
              local output rc
              set +e
              output="$("$@" 2>&1)"
              rc=$?
              set -e
              if [ "$rc" -eq 0 ]; then
                [ -n "$output" ] && printf '%s\n' "$output"
                return 0
              fi
              if printf '%s\n' "$output" | grep -Eq 'HTTP 5[0-9][0-9]|No server is currently available|Bad Gateway|Service Unavailable|502|503|504'; then
                if [ "$n" -ge 8 ]; then
                  printf '%s\n' "$output" >&2
                  return "$rc"
                fi
                echo "RETRY ${n}/8: transient GitHub/API failure, waiting ${delay}s..." >&2
                sleep "$delay"
                n=$((n + 1))
                delay=$((delay * 2))
                [ "$delay" -gt 40 ] && delay=40
                continue
              fi
              printf '%s\n' "$output" >&2
              return "$rc"
            done
          }
          mapfile -d '' FILES < <(
            find release-assets -type f \
              \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.ipa' -o -name '*.apk' -o -name '*.aab' -o -name '*.app.tar.gz' -o -name '*.sig' -o -name 'latest.json' \) \
              -print0
          )

          if [ "${#FILES[@]}" -lt 7 ]; then
            echo "HIBA: a Release-hez túl kevés fájl található: ${#FILES[@]}"
            exit 1
          fi

          printf 'Feltöltendő Release-fájlok:\n'
          printf ' - %s\n' "${FILES[@]}"

          if retry_gh gh release view "$TAG" >/dev/null 2>&1; then
            while IFS= read -r ASSET; do
              case "$ASSET" in
                *.dmg|*.exe|*.AppImage|*.deb|*.ipa|*.apk|*.aab)
                  ;;
                *)
                  retry_gh gh release delete-asset "$TAG" "$ASSET" --yes || true
                  ;;
              esac
            done < <(retry_gh gh release view "$TAG" --json assets --jq '.assets[].name')

            retry_gh gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            retry_gh gh release create "$TAG" "${FILES[@]}" \
              --target "$GITHUB_SHA" \
              --title "Arduino LED Controller v$VERSION" \
              --notes "Automatikusan fordított Tauri kiadás Windows, macOS, Linux, Android, iPhone és iPad platformokra ugyanabból a forrásverzióból. Az unsigned iOS IPA telepítés előtt külön aláírást vagy sideload eszközt igényel. Android aláíró secretek nélkül debug APK és aláíratlan AAB készül; Play Store kiadáshoz állandó Android aláírókulcs szükséges."
          fi
      - name: Publish Stable updater feed alias
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          retry_gh() {
            local n=1 delay=5
            while true; do
              local output rc
              set +e
              output="$("$@" 2>&1)"
              rc=$?
              set -e
              if [ "$rc" -eq 0 ]; then
                [ -n "$output" ] && printf '%s\n' "$output"
                return 0
              fi
              if printf '%s\n' "$output" | grep -Eq 'HTTP 5[0-9][0-9]|No server is currently available|Bad Gateway|Service Unavailable|502|503|504'; then
                if [ "$n" -ge 8 ]; then
                  printf '%s\n' "$output" >&2
                  return "$rc"
                fi
                echo "RETRY ${n}/8: transient GitHub/API failure, waiting ${delay}s..." >&2
                sleep "$delay"
                n=$((n + 1))
                delay=$((delay * 2))
                [ "$delay" -gt 40 ] && delay=40
                continue
              fi
              printf '%s\n' "$output" >&2
              return "$rc"
            done
          }
          if retry_gh gh release view updater-stable >/dev/null 2>&1; then
            retry_gh gh release upload updater-stable release-assets/latest.json --clobber
          else
            retry_gh gh release create updater-stable release-assets/latest.json               --target "${GITHUB_SHA}"               --title "Arduino LED Controller Stable Updater Feed"               --notes "Machine-readable signed Stable updater feed."               --prerelease
          fi
      - name: Verify Stable updater feed alias
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          retry_gh() {
            local n=1 delay=5
            while true; do
              local output rc
              set +e
              output="$("$@" 2>&1)"
              rc=$?
              set -e
              if [ "$rc" -eq 0 ]; then
                [ -n "$output" ] && printf '%s\n' "$output"
                return 0
              fi
              if printf '%s\n' "$output" | grep -Eq 'HTTP 5[0-9][0-9]|No server is currently available|Bad Gateway|Service Unavailable|502|503|504'; then
                if [ "$n" -ge 8 ]; then
                  printf '%s\n' "$output" >&2
                  return "$rc"
                fi
                echo "RETRY ${n}/8: transient GitHub/API failure, waiting ${delay}s..." >&2
                sleep "$delay"
                n=$((n + 1))
                delay=$((delay * 2))
                [ "$delay" -gt 40 ] && delay=40
                continue
              fi
              printf '%s\n' "$output" >&2
              return "$rc"
            done
          }
          TMP="$(mktemp -d)"
          retry_gh gh release download updater-stable --pattern latest.json --dir "${TMP}" --clobber
          VERSION="$(tr -d '[:space:]' < VERSION)"
          VERSION="${VERSION}" node -e "const f=require('fs');const j=JSON.parse(f.readFileSync(process.argv[1],'utf8'));if(j.version!==process.env.VERSION)process.exit(1);for(const k of ['linux-x86_64','windows-x86_64','darwin-aarch64','darwin-x86_64'])if(!j.platforms?.[k]?.signature)process.exit(2)" "${TMP}/latest.json"
