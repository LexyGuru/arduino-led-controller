name: Application Stable release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the GitHub Stable release after every build succeeds
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: application-stable-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  EXPECTED_BRANCH: main

jobs:
  validate:
    name: Stable release gate
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      doc_prefix: ${{ steps.version.outputs.doc_prefix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Verify release branch and version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}" || {
            echo "::error::A Stable release csak a ${EXPECTED_BRANCH} ágról indítható."
            exit 1
          }
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "${VERSION}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || {
            echo "::error::Stable release csak prerelease suffix nélküli verzióval indítható: ${VERSION}"
            exit 1
          }
          node -e "const r=require('./release-versions.json'); if(r.schemaVersion!==2||r.applicationRelease?.channel!=='stable'||r.applicationRelease?.branch!=='main'||r.applicationRelease?.updaterAlias!=='updater-stable') process.exit(1)"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          DOC_PREFIX="V${MAJOR}${MINOR}_STABLE"
          echo "doc_prefix=${DOC_PREFIX}" >> "${GITHUB_OUTPUT}"
          echo "Release documentation prefix: ${DOC_PREFIX}"

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install desktop dependencies
        working-directory: desktop-tauri
        run: npm ci --no-audit --no-fund

      - name: Verify synchronized versions
        run: python3 scripts/check-versions.py

      - name: Verify Stable distribution contracts
        run: |
          npm run test:release-architecture-v2
          npm run test:release-workflow-architecture-v2

      - name: Enforce immutable macOS OTA Beta.7 contract
        run: npm run test:macos-ota-immutable

      - name: Run full Node regression suite
        run: npm test

      - name: Validate repository
        run: bash scripts/validate-repository.sh

      - name: Build desktop frontend
        working-directory: desktop-tauri
        run: npm run build

      - name: Check Rust backend
        run: RUSTFLAGS="-D warnings" cargo check --locked --manifest-path desktop-tauri/src-tauri/Cargo.toml

      - name: Test Rust backend
        run: RUSTFLAGS="-D warnings" cargo test --locked --manifest-path desktop-tauri/src-tauri/Cargo.toml

  build-desktop:
    name: ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04
            key: linux-x86_64
            args: --bundles appimage,deb
            target: ""
          - name: Windows x86_64
            os: windows-latest
            key: windows-x86_64
            args: --bundles nsis
            target: ""
          - name: macOS Apple Silicon
            os: macos-15
            key: macos-apple-silicon
            args: --target aarch64-apple-darwin --bundles dmg,app
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-15-intel
            key: macos-intel
            args: --target x86_64-apple-darwin --bundles dmg,app
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop-tauri
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add explicit Rust target
        if: matrix.target != ''
        run: rustup target add "${{ matrix.target }}"

      - name: Install Linux system dependencies
        if: matrix.key == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Test Rust library
        run: RUSTFLAGS="-D warnings" cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Verify Tauri updater signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}" || { echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY"; exit 1; }
          test -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" || { echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD"; exit 1; }

      - name: Build Tauri installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: desktop-tauri
          args: ${{ matrix.args }}

      - name: Collect normalized installer files
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          PLATFORM_KEY: ${{ matrix.key }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          case "${PLATFORM_KEY}" in
            linux-x86_64)
              APPIMAGE="$(find src-tauri/target -type f -path '*/bundle/appimage/*.AppImage' -print | sort | tail -n 1)"
              DEB="$(find src-tauri/target -type f -path '*/bundle/deb/*.deb' -print | sort | tail -n 1)"
              test -f "${APPIMAGE}"
              test -f "${DEB}"
              APPIMAGE_SIG="${APPIMAGE}.sig"
              test -f "${APPIMAGE_SIG}"
              cp "${APPIMAGE}" "artifacts/Arduino_LED_Controller_${VERSION}_Linux_x86_64.AppImage"
              cp "${APPIMAGE_SIG}" "artifacts/Arduino_LED_Controller_${VERSION}_Linux_x86_64.AppImage.sig"
              cp "${DEB}" "artifacts/Arduino_LED_Controller_${VERSION}_Linux_x86_64.deb"
              ;;
            windows-x86_64)
              EXE="$(find src-tauri/target -type f -path '*/bundle/nsis/*.exe' -print | sort | tail -n 1)"
              test -f "${EXE}"
              EXE_SIG="${EXE}.sig"
              test -f "${EXE_SIG}"
              cp "${EXE}" "artifacts/Arduino_LED_Controller_${VERSION}_Windows_x86_64_Setup.exe"
              cp "${EXE_SIG}" "artifacts/Arduino_LED_Controller_${VERSION}_Windows_x86_64_Setup.exe.sig"
              ;;
            macos-apple-silicon)
              DMG="$(find src-tauri/target -type f -path '*/bundle/dmg/*.dmg' -print | sort | tail -n 1)"
              test -n "${DMG}" && test -f "${DMG}" || { echo "::error::MACOS_DMG=MISSING (${PLATFORM_KEY})"; exit 1; }
              APP_TAR="$(find src-tauri/target -type f -path '*/bundle/macos/*.app.tar.gz' -print | sort | tail -n 1)"
              APP_TAR_SIG="${APP_TAR}.sig"
              test -n "${APP_TAR}" && test -f "${APP_TAR}" || { echo "::error::MACOS_UPDATER_TAR=MISSING (${PLATFORM_KEY})"; exit 1; }
              echo "MACOS_UPDATER_TAR=FOUND (${PLATFORM_KEY})"
              test -f "${APP_TAR_SIG}" || { echo "::error::MACOS_UPDATER_SIGNATURE=MISSING (${PLATFORM_KEY})"; exit 1; }
              echo "MACOS_UPDATER_SIGNATURE=FOUND (${PLATFORM_KEY})"
              cp "${DMG}" "artifacts/Arduino_LED_Controller_${VERSION}_macOS_Apple_Silicon.dmg"
              cp "${APP_TAR}" "artifacts/Arduino_LED_Controller_${VERSION}_macOS_Apple_Silicon.app.tar.gz"
              cp "${APP_TAR_SIG}" "artifacts/Arduino_LED_Controller_${VERSION}_macOS_Apple_Silicon.app.tar.gz.sig"
              ;;
            macos-intel)
              DMG="$(find src-tauri/target -type f -path '*/bundle/dmg/*.dmg' -print | sort | tail -n 1)"
              test -n "${DMG}" && test -f "${DMG}" || { echo "::error::MACOS_DMG=MISSING (${PLATFORM_KEY})"; exit 1; }
              APP_TAR="$(find src-tauri/target -type f -path '*/bundle/macos/*.app.tar.gz' -print | sort | tail -n 1)"
              APP_TAR_SIG="${APP_TAR}.sig"
              test -n "${APP_TAR}" && test -f "${APP_TAR}" || { echo "::error::MACOS_UPDATER_TAR=MISSING (${PLATFORM_KEY})"; exit 1; }
              echo "MACOS_UPDATER_TAR=FOUND (${PLATFORM_KEY})"
              test -f "${APP_TAR_SIG}" || { echo "::error::MACOS_UPDATER_SIGNATURE=MISSING (${PLATFORM_KEY})"; exit 1; }
              echo "MACOS_UPDATER_SIGNATURE=FOUND (${PLATFORM_KEY})"
              cp "${DMG}" "artifacts/Arduino_LED_Controller_${VERSION}_macOS_Intel.dmg"
              cp "${APP_TAR}" "artifacts/Arduino_LED_Controller_${VERSION}_macOS_Intel.app.tar.gz"
              cp "${APP_TAR_SIG}" "artifacts/Arduino_LED_Controller_${VERSION}_macOS_Intel.app.tar.gz.sig"
              ;;
            *)
              echo "::error::Ismeretlen platform: ${PLATFORM_KEY}"
              exit 1
              ;;
          esac
          find artifacts -maxdepth 1 -type f -print

      - name: Upload desktop installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: stable-${{ matrix.key }}
          path: desktop-tauri/artifacts/*
          if-no-files-found: error
          retention-days: 30

  build-android:
    name: Android APK and AAB
    needs: validate
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
        working-directory: desktop-tauri
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Tauri CLI
        run: npm install --no-save --package-lock=false @tauri-apps/cli@2.11.4

      - name: Initialize Android project
        run: |
          set -euo pipefail
          if [ ! -d src-tauri/gen/android ]; then
            npx tauri android init --ci
          fi
          test -f src-tauri/gen/android/gradlew
          chmod +x src-tauri/gen/android/gradlew

      - name: Generate V5 Android launcher icons
        run: bash ../scripts/generate-v5-mobile-icons.sh

      - name: Configure Android release signing when available
        id: signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEY_BASE64:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "signed=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Android signing secrets are missing. A debug APK and unsigned AAB will be published."
            exit 0
          fi
          KEYSTORE="${RUNNER_TEMP}/arduino-led-controller-upload.jks"
          printf '%s' "${ANDROID_KEY_BASE64}" | base64 --decode > "${KEYSTORE}"
          chmod 600 "${KEYSTORE}"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          keyAlias=${ANDROID_KEY_ALIAS}
          password=${ANDROID_KEY_PASSWORD}
          storeFile=${KEYSTORE}
          EOF
          python3 <<'PY'
          from pathlib import Path
          import re
          path = Path("src-tauri/gen/android/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          if "import java.util.Properties" not in text:
              text = "import java.util.Properties\nimport java.io.FileInputStream\n" + text
          signing_block = '''
              signingConfigs {
                  create("release") {
                      val keystorePropertiesFile = rootProject.file("keystore.properties")
                      val keystoreProperties = Properties()
                      if (keystorePropertiesFile.exists()) {
                          keystoreProperties.load(FileInputStream(keystorePropertiesFile))
                      }
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["password"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["password"] as String
                  }
              }
          '''
          if 'create("release")' not in text:
              marker = "    buildTypes {"
              if marker not in text:
                  raise SystemExit("Missing buildTypes block")
              text = text.replace(marker, signing_block + marker, 1)
          if 'signingConfig = signingConfigs.getByName("release")' not in text:
              for pattern in [r'(getByName\("release"\)\s*\{)', r'(release\s*\{)']:
                  updated, count = re.subn(
                      pattern,
                      r'\1\n            signingConfig = signingConfigs.getByName("release")',
                      text,
                      count=1,
                  )
                  if count:
                      text = updated
                      break
              else:
                  raise SystemExit("Missing release build type")
          path.write_text(text, encoding="utf-8")
          PY
          echo "signed=true" >> "${GITHUB_OUTPUT}"

      - name: Build signed Android release packages
        if: steps.signing.outputs.signed == 'true'
        run: |
          npx tauri android build --ci --apk
          npx tauri android build --ci --aab

      - name: Build debug APK and unsigned AAB
        if: steps.signing.outputs.signed != 'true'
        run: |
          npx tauri android build --ci --debug --apk
          npx tauri android build --ci --aab

      - name: Collect Android packages
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [ "${SIGNED}" = "true" ]; then
            APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' ! -name '*unsigned*' -print | sort | tail -n 1)"
            AAB="$(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' -print | sort | tail -n 1)"
            APK_OUT="artifacts/Arduino_LED_Controller_${VERSION}_Android.apk"
            AAB_OUT="artifacts/Arduino_LED_Controller_${VERSION}_Android.aab"
          else
            APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*debug*.apk' -print | sort | tail -n 1)"
            AAB="$(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' -print | sort | tail -n 1)"
            APK_OUT="artifacts/Arduino_LED_Controller_${VERSION}_Android_debug.apk"
            AAB_OUT="artifacts/Arduino_LED_Controller_${VERSION}_Android_unsigned.aab"
          fi
          test -f "${APK}"
          test -f "${AAB}"
          cp "${APK}" "${APK_OUT}"
          cp "${AAB}" "${AAB_OUT}"
          find artifacts -maxdepth 1 -type f -print

      - name: Upload Android artifact
        uses: actions/upload-artifact@v6
        with:
          name: stable-android
          path: desktop-tauri/artifacts/*
          if-no-files-found: error
          retention-days: 30

  build-ios:
    name: Unsigned iOS and iPadOS IPA
    needs: validate
    runs-on: macos-15
    defaults:
      run:
        shell: bash
        working-directory: desktop-tauri
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Remove unused untrusted Homebrew tap
        run: brew untap aws/tap || true

      - name: Set up Rust iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Tauri CLI
        run: npm install --no-save --package-lock=false @tauri-apps/cli@2.11.4

      - name: Initialize iOS project
        run: |
          if [ ! -d src-tauri/gen/apple ]; then
            npx tauri ios init --ci
          fi

      - name: Generate V5 iOS and iPadOS app icons
        run: bash ../scripts/generate-v5-mobile-icons.sh

      - name: Build unsigned IPA
        run: npx tauri ios build --ci --no-sign

      - name: Collect unsigned IPA
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          IPA="$(find src-tauri/gen/apple -type f -name '*.ipa' -print | sort | tail -n 1)"
          test -f "${IPA}"
          mkdir -p artifacts
          cp "${IPA}" "artifacts/Arduino_LED_Controller_${VERSION}_iOS_iPadOS_unsigned.ipa"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: stable-ios-unsigned
          path: desktop-tauri/artifacts/*
          if-no-files-found: error
          retention-days: 30

  build-lxc:
    name: Debian and Proxmox LXC server bundle
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build versioned Stable LXC bundle
        env:
          OUTPUT_DIR: ${{ github.workspace }}/artifacts
          OUTPUT_BASENAME: Arduino_LED_Controller_${{ needs.validate.outputs.version }}_LXC_Server
        run: bash deploy/build-stable-release-bundle.sh

      - name: Upload LXC artifact
        uses: actions/upload-artifact@v6
        with:
          name: stable-lxc-server
          path: artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Stable release
    if: ${{ inputs.publish }}
    needs:
      - validate
      - build-desktop
      - build-android
      - build-ios
      - build-lxc
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Add installation assets and release documentation
        env:
          DOC_PREFIX: ${{ needs.validate.outputs.doc_prefix }}
        run: |
          set -euo pipefail
          cp release-versions.json release-assets/
          cp "docs/v5/${DOC_PREFIX}_INSTALLATION_GUIDE.md" release-assets/
          cp "docs/v5/${DOC_PREFIX}_RELEASE_NOTES.md" release-assets/
          cp "docs/v5/${DOC_PREFIX}_RELEASE_CHECKLIST.md" release-assets/
          test -f "release-assets/${DOC_PREFIX}_INSTALLATION_GUIDE.md"
          test -f "release-assets/${DOC_PREFIX}_RELEASE_NOTES.md"
          test -f "release-assets/${DOC_PREFIX}_RELEASE_CHECKLIST.md"
          cp deploy/install-rust-lxc-native.sh release-assets/
          cp deploy/rust-lxc.env.example release-assets/
          chmod 0755 release-assets/install-rust-lxc-native.sh

      - name: Verify expected release asset classes
        env:
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/verify-stable-release-assets-v650.js release-assets "${EXPECTED_VERSION}"
          find release-assets -maxdepth 1 -type f -print | sort

      - name: Generate Tauri updater static feed
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/generate-stable-tauri-updater-feed-v650.js \
            --root release-assets \
            --version "${VERSION}" \
            --tag "${TAG}"

      - name: Generate supply-chain evidence
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/generate-release-sbom.js \
            --root "${GITHUB_WORKSPACE}" \
            --output "${GITHUB_WORKSPACE}/release-assets/SBOM.cdx.json" \
            --version "${{ needs.validate.outputs.version }}" \
            --commit "${GITHUB_SHA}"
          node scripts/generate-release-provenance.js \
            --root "${GITHUB_WORKSPACE}" \
            --output "${GITHUB_WORKSPACE}/release-assets/PROVENANCE.json" \
            --commit "${GITHUB_SHA}" \
            --phase stable \
            --target-version "${{ needs.validate.outputs.version }}" \
            --builder-id "https://github.com/LexyGuru/arduino-led-controller/actions/workflows/app-stable-release.yml" \
            --dependency-install "npm-ci" \
            --byproducts "SBOM.cdx.json,SECRET-SCAN.json,SHA256SUMS,latest.json,latest-stable.json,RELEASE-MANIFEST.json"
          node scripts/scan-release-secrets.js \
            --root "${GITHUB_WORKSPACE}/release-assets" \
            --output "${GITHUB_WORKSPACE}/release-assets/SECRET-SCAN.json"

      - name: Generate checksums and machine-readable manifest
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/generate-stable-release-metadata-v650.js \
            --root release-assets \
            --version "${VERSION}" \
            --tag "${TAG}" \
            --commit "${GITHUB_SHA}" \
            --published-at "${GITHUB_RUN_ID}"

      - name: Enforce application-only release assets
        run: |
          set -euo pipefail
          if find release-assets -maxdepth 1 -type f \( -name 'Arduino_LED_Controller_Firmware_*' -o -name 'firmware-release.json' -o -name 'firmware-catalog.json' \) | grep -q .; then
            echo "::error::Firmware asset nem kerülhet az alkalmazás Stable release-be."
            exit 1
          fi

      - name: Verify Stable documentation assets
        env:
          DOC_PREFIX: ${{ needs.validate.outputs.doc_prefix }}
        run: |
          set -euo pipefail
          test -f "release-assets/${DOC_PREFIX}_INSTALLATION_GUIDE.md"
          test -f "release-assets/${DOC_PREFIX}_RELEASE_NOTES.md"
          test -f "release-assets/${DOC_PREFIX}_RELEASE_CHECKLIST.md"

      - name: Publish or update Stable release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Arduino LED Controller ${{ needs.validate.outputs.version }}
          body_path: docs/v5/${{ needs.validate.outputs.doc_prefix }}_RELEASE_NOTES.md
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: release-assets/*

      - name: Publish stable updater feed alias
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          retry_gh() {
            local n=1 delay=5
            while true; do
              local output rc
              set +e
              output="$("$@" 2>&1)"
              rc=$?
              set -e
              if [ "$rc" -eq 0 ]; then
                [ -n "$output" ] && printf '%s\n' "$output"
                return 0
              fi
              if printf '%s\n' "$output" | grep -Eq 'HTTP 5[0-9][0-9]|No server is currently available|Bad Gateway|Service Unavailable|502|503|504'; then
                if [ "$n" -ge 8 ]; then
                  printf '%s\n' "$output" >&2
                  return "$rc"
                fi
                echo "RETRY ${n}/8: transient GitHub/API failure, waiting ${delay}s..." >&2
                sleep "$delay"
                n=$((n + 1))
                delay=$((delay * 2))
                [ "$delay" -gt 40 ] && delay=40
                continue
              fi
              printf '%s\n' "$output" >&2
              return "$rc"
            done
          }
          if retry_gh gh release view updater-stable >/dev/null 2>&1; then
            retry_gh gh release upload updater-stable release-assets/latest.json --clobber
          else
            retry_gh gh release create updater-stable release-assets/latest.json \
              --target "${GITHUB_SHA}" \
              --title "Arduino LED Controller Stable Updater Feed" \
              --notes "Machine-readable signed Stable updater feed. Use the versioned Stable release for human downloads." \
              --latest=false
          fi
