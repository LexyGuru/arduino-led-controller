                continue
              fi
              printf '%s\n' "$output" >&2
              return "$rc"
            done
          }
          TMP="$(mktemp -d)"
          retry_gh gh release view updater-stable --json isDraft,isPrerelease,targetCommitish \
            --jq '{isDraft,isPrerelease,targetCommitish}'
          test "$(retry_gh gh release view updater-stable --json isDraft --jq '.isDraft')" = "false"
          test "$(retry_gh gh release view updater-stable --json isPrerelease --jq '.isPrerelease')" = "false"
          retry_gh gh release download updater-stable --pattern latest.json --dir "${TMP}" --clobber
          node -e "const f=require('fs');const j=JSON.parse(f.readFileSync(process.argv[1],'utf8'));if(j.version!==process.env.VERSION)process.exit(1);for(const k of ['linux-x86_64','windows-x86_64','darwin-aarch64','darwin-x86_64']){if(!j.platforms?.[k]?.url||!j.platforms?.[k]?.signature)process.exit(2)}" "${TMP}/latest.json"

      - name: Verify published Stable release
        env:
          GH_TOKEN: ${{ github.token }}
