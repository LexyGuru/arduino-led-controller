name: Desktop alkalmazás kiadás

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Kiadás verziója, például 1.0.0'
        required: true
        type: string
  push:
    branches: [main]
    tags: ['desktop-v*']

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }} alkalmazás
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win nsis
          - name: macOS
            os: macos-latest
            target: --mac dmg
            skip_ota_tool: '1'
          - name: Linux
            os: ubuntu-latest
            target: --linux AppImage deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: node desktop/prepare-ota.cjs
        env:
          SKIP_OTA_TOOL: ${{ matrix.skip_ota_tool }}
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v5
        with:
          name: desktop-${{ matrix.name }}
          # Csak a kész telepítőket adjuk át a Release feladatnak; a
          # kicsomagolt Electron-mappa több száz belső fájlja nem kiadási asset.
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    name: Letölthető GitHub kiadás
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          path: desktop-release
          merge-multiple: true
      - name: Kiadás létrehozása és fájlok feltöltése (újrapróbálással)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('desktop-v{0}', inputs.version) || github.ref_type == 'tag' && github.ref_name || format('desktop-v1.0.{0}', github.run_number) }}
          RELEASE_NAME: Arduino LED Controller ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_type == 'tag' && github.ref_name || format('1.0.{0}', github.run_number) }}
        run: |
          mapfile -d '' ASSETS < <(find desktop-release -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) -print0)
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo 'Nem található feltölthető telepítőfájl.' >&2
            find desktop-release -maxdepth 2 -type f >&2
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber && exit 0
            else
              gh release create "$RELEASE_TAG" "${ASSETS[@]}" --title "$RELEASE_NAME" --generate-notes && exit 0
            fi
            echo "A GitHub kiadás feltöltése sikertelen, újrapróbálás: $attempt/5"
            sleep $((attempt * 10))
          done
          exit 1
