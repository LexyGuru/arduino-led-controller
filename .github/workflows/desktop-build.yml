name: Desktop alkalmazás kiadás

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Kiadás verziója, például 1.0.0'
        required: true
        type: string
  push:
    branches: [main]
    tags: ['desktop-v*']

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }} alkalmazás
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win nsis
          - name: macOS
            os: macos-latest
            target: --mac dmg
          - name: Linux
            os: ubuntu-latest
            target: --linux AppImage deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node desktop/prepare-ota.cjs
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  release:
    name: Letölthető GitHub kiadás
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: desktop-release
          merge-multiple: true
      - name: Kiadás létrehozása és fájlok feltöltése
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('desktop-v{0}', inputs.version) || github.ref_type == 'tag' && github.ref_name || format('desktop-v1.0.{0}', github.run_number) }}
          name: Arduino LED Controller ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_type == 'tag' && github.ref_name || format('1.0.{0}', github.run_number) }}
          generate_release_notes: true
          files: desktop-release/**/*
