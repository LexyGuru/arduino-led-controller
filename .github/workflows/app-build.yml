name: Application build

on:
  workflow_dispatch:
  workflow_call:

# A build jobok csak olvasnak. Kizárólag a release job kap írási jogot.
permissions:
  contents: read

jobs:
  # ============================================================
  # DESKTOP – SIGNED STABLE INSTALLERS + UPDATER ARTIFACTS
  # ============================================================
  build-desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04
            key: linux-x86_64
            args: --bundles appimage,deb
            target: ""
          - name: Windows x86_64
            os: windows-latest
            key: windows-x86_64
            args: --bundles nsis
            target: ""
          - name: macOS Apple Silicon
            os: macos-15
            key: macos-apple-silicon
            args: --target aarch64-apple-darwin --bundles dmg,app
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-15-intel
            key: macos-intel
            args: --target x86_64-apple-darwin --bundles dmg,app
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop-tauri
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Add explicit Rust target
        if: matrix.target != ''
        run: rustup target add "${{ matrix.target }}"
      - name: Install Linux system dependencies
        if: matrix.key == 'linux-x86_64'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      - name: Test Rust library
        run: RUSTFLAGS="-D warnings" cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Verify Tauri updater signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}" || { echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY"; exit 1; }
          test -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" || { echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD"; exit 1; }
      - name: Build signed Tauri installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: desktop-tauri
          args: ${{ matrix.args }}
      - name: Read application version
        id: version
        run: |
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Collect signed updater artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PLATFORM_KEY: ${{ matrix.key }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          case "${PLATFORM_KEY}" in
            linux-x86_64)
              APP="$(find src-tauri/target -type f -path '*/bundle/appimage/*.AppImage' | sort | tail -n 1)"
              DEB="$(find src-tauri/target -type f -path '*/bundle/deb/*.deb' | sort | tail -n 1)"
              test -f "${APP}" && test -f "${APP}.sig" && test -f "${DEB}"
              cp "${APP}" "artifacts/Arduino_LED_Controller_${VERSION}_Linux_x86_64.AppImage"
              cp "${APP}.sig" "artifacts/Arduino_LED_Controller_${VERSION}_Linux_x86_64.AppImage.sig"
              cp "${DEB}" "artifacts/Arduino_LED_Controller_${VERSION}_Linux_x86_64.deb"
              ;;
            windows-x86_64)
              EXE="$(find src-tauri/target -type f -path '*/bundle/nsis/*.exe' | sort | tail -n 1)"
              test -f "${EXE}" && test -f "${EXE}.sig"
              cp "${EXE}" "artifacts/Arduino_LED_Controller_${VERSION}_Windows_x86_64_Setup.exe"
              cp "${EXE}.sig" "artifacts/Arduino_LED_Controller_${VERSION}_Windows_x86_64_Setup.exe.sig"
              ;;
            macos-apple-silicon)
              DMG="$(find src-tauri/target -type f -path '*/bundle/dmg/*.dmg' | sort | tail -n 1)"
              TAR="$(find src-tauri/target -type f -path '*/bundle/macos/*.app.tar.gz' | sort | tail -n 1)"
              test -f "${DMG}" && test -f "${TAR}" && test -f "${TAR}.sig"
              cp "${DMG}" "artifacts/Arduino_LED_Controller_${VERSION}_macOS_Apple_Silicon.dmg"
              cp "${TAR}" "artifacts/Arduino_LED_Controller_${VERSION}_macOS_Apple_Silicon.app.tar.gz"
              cp "${TAR}.sig" "artifacts/Arduino_LED_Controller_${VERSION}_macOS_Apple_Silicon.app.tar.gz.sig"
              ;;
            macos-intel)
              DMG="$(find src-tauri/target -type f -path '*/bundle/dmg/*.dmg' | sort | tail -n 1)"
              TAR="$(find src-tauri/target -type f -path '*/bundle/macos/*.app.tar.gz' | sort | tail -n 1)"
              test -f "${DMG}" && test -f "${TAR}" && test -f "${TAR}.sig"
              cp "${DMG}" "artifacts/Arduino_LED_Controller_${VERSION}_macOS_Intel.dmg"
              cp "${TAR}" "artifacts/Arduino_LED_Controller_${VERSION}_macOS_Intel.app.tar.gz"
              cp "${TAR}.sig" "artifacts/Arduino_LED_Controller_${VERSION}_macOS_Intel.app.tar.gz.sig"
              ;;
          esac
      - name: Upload signed desktop artifact
        uses: actions/upload-artifact@v6
        with:
          name: stable-${{ matrix.key }}
          path: desktop-tauri/artifacts/*
          if-no-files-found: error
          retention-days: 30

  # ============================================================
  # IOS / IPADOS – ALÁÍRATLAN IPA
  # ============================================================
  build-ios:
    name: Aláíratlan iPhone/iPad IPA
    runs-on: macos-15

    defaults:
      run:
        shell: bash
        working-directory: desktop-tauri

    steps:
      - name: Forrás letöltése
        uses: actions/checkout@v5

      - name: Node.js telepítése
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Remove unused untrusted Homebrew tap
        run: brew untap aws/tap || true

      - name: Rust és iOS target telepítése
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: JavaScript függőségek telepítése
        run: npm install --no-audit --no-fund

      # A --no-sign kapcsoló biztos támogatásához rögzített CLI-verzió.
      - name: Tauri CLI 2.11.4 telepítése
        run: |
          npm install \
            --no-save \
            --package-lock=false \
            @tauri-apps/cli@2.11.4

      - name: Alkalmazásverzió beolvasása
        id: ios_version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          test -n "$VERSION" || { echo "::error::A Tauri verzió nem olvasható ki."; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Tauri iOS projekt inicializálása
        run: |
          set -euo pipefail
          if [ -d "src-tauri/gen/apple" ]; then
            echo "A generált Apple projekt már létezik; az init lépés kihagyva."
          else
            npx tauri ios init --ci
          fi

      - name: Aláíratlan iOS/iPadOS IPA fordítása
        run: npx tauri ios build --ci --no-sign

      - name: Elkészült IPA összegyűjtése
        env:
          VERSION: ${{ steps.ios_version.outputs.version }}
        run: |
          set -euo pipefail
          IPA_PATH="$(find src-tauri/gen/apple -type f -name '*.ipa' -print -quit)"

          if [ -z "$IPA_PATH" ]; then
            echo "::error::Nem található elkészült IPA fájl."
            find src-tauri/gen/apple -maxdepth 12 -type f 2>/dev/null | sort | tail -n 300 || true
            exit 1
          fi

          mkdir -p artifacts
          OUTPUT="artifacts/Arduino_LED_Controller_${VERSION}_unsigned.ipa"
          cp "$IPA_PATH" "$OUTPUT"
          unzip -l "$OUTPUT" | head -n 60
          ls -lh "$OUTPUT"

      - name: Aláíratlan IPA feltöltése workflow artifactként
        uses: actions/upload-artifact@v6
        with:
          name: arduino-led-controller-ios-unsigned
          path: desktop-tauri/artifacts/*_unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  # ============================================================
  # ANDROID – APK + AAB
  # ============================================================
  build-android:
    name: Android APK és AAB
    runs-on: ubuntu-22.04

    defaults:
      run:
        shell: bash
        working-directory: desktop-tauri

    steps:
      - name: Forrás letöltése
        uses: actions/checkout@v5

      - name: Node.js telepítése
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Java 17 telepítése
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK telepítése
        uses: android-actions/setup-android@v4

      - name: Android SDK licencek elfogadása
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Rust és Android targetek telepítése
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: JavaScript függőségek telepítése
        run: npm install --no-audit --no-fund

      - name: Tauri CLI 2.11.4 telepítése
        run: |
          npm install \
            --no-save \
            --package-lock=false \
            @tauri-apps/cli@2.11.4

      - name: Alkalmazásverzió beolvasása
        id: android_version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          test -n "$VERSION" || { echo "::error::A Tauri verzió nem olvasható ki."; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Tauri Android projekt inicializálása
        run: |
          set -euo pipefail
          if [ -d "src-tauri/gen/android" ]; then
            echo "A generált Android projekt már létezik; az init lépés kihagyva."
          else
            npx tauri android init --ci
          fi

      - name: Generált Android/Gradle projekt ellenőrzése
        run: |
          set -euo pipefail
          test -d src-tauri/gen/android || { echo "::error::Az Android projekt nem jött létre."; exit 1; }
          test -f src-tauri/gen/android/gradlew || { echo "::error::Hiányzik a Gradle wrapper: src-tauri/gen/android/gradlew"; exit 1; }
          test -f src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties || { echo "::error::Hiányzik a gradle-wrapper.properties."; exit 1; }
          chmod +x src-tauri/gen/android/gradlew
          src-tauri/gen/android/gradlew --version

      - name: Android release-aláírás beállítása, ha a secretek elérhetők
        id: android_signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_KEY_BASE64:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android aláíró secretek hiányoznak. Telepíthető debug APK és aláíratlan AAB készül."
            exit 0
          fi

          KEYSTORE="$RUNNER_TEMP/arduino-led-controller-upload.jks"
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          cat > src-tauri/gen/android/keystore.properties <<EOF
          keyAlias=$ANDROID_KEY_ALIAS
          password=$ANDROID_KEY_PASSWORD
          storeFile=$KEYSTORE
          EOF

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src-tauri/gen/android/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          if "import java.util.Properties" not in text:
              text = "import java.util.Properties\nimport java.io.FileInputStream\n" + text

          signing_block = '''
              signingConfigs {
                  create("release") {
                      val keystorePropertiesFile = rootProject.file("keystore.properties")
                      val keystoreProperties = Properties()
                      if (keystorePropertiesFile.exists()) {
                          keystoreProperties.load(FileInputStream(keystorePropertiesFile))
                      }
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["password"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["password"] as String
                  }
              }

          '''

          if 'create("release")' not in text:
              marker = "    buildTypes {"
              if marker not in text:
                  raise SystemExit("Nem található a buildTypes blokk a build.gradle.kts fájlban.")
              text = text.replace(marker, signing_block + marker, 1)

          if 'signingConfig = signingConfigs.getByName("release")' not in text:
              patterns = [
                  r'(getByName\("release"\)\s*\{)',
                  r'(release\s*\{)',
              ]
              for pattern in patterns:
                  updated, count = re.subn(
                      pattern,
                      r'\1\n            signingConfig = signingConfigs.getByName("release")',
                      text,
                      count=1,
                  )
                  if count:
                      text = updated
                      break
              else:
                  raise SystemExit("Nem található a release buildType blokk a build.gradle.kts fájlban.")

          path.write_text(text, encoding="utf-8")
          PY

          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Android release-aláírás beállítva."

      - name: Android release APK és AAB fordítása
        if: steps.android_signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          npx tauri android build --ci --apk
          npx tauri android build --ci --aab

      - name: Android debug APK és aláíratlan AAB fordítása
        if: steps.android_signing.outputs.signed != 'true'
        run: |
          set -euo pipefail
          npx tauri android build --ci --debug --apk
          npx tauri android build --ci --aab

      - name: Android csomagok összegyűjtése
        env:
          VERSION: ${{ steps.android_version.outputs.version }}
          SIGNED: ${{ steps.android_signing.outputs.signed }}
        run: |
          set -euo pipefail
          mkdir -p artifacts

          if [ "$SIGNED" = "true" ]; then
            APK_PATH="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' ! -name '*unsigned*' -print | sort | tail -n 1)"
            AAB_PATH="$(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' -print | sort | tail -n 1)"
            APK_OUTPUT="artifacts/Arduino_LED_Controller_${VERSION}_Android.apk"
            AAB_OUTPUT="artifacts/Arduino_LED_Controller_${VERSION}_Android.aab"
          else
            APK_PATH="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*debug*.apk' -print | sort | tail -n 1)"
            AAB_PATH="$(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' -print | sort | tail -n 1)"
            APK_OUTPUT="artifacts/Arduino_LED_Controller_${VERSION}_Android_debug.apk"
            AAB_OUTPUT="artifacts/Arduino_LED_Controller_${VERSION}_Android_unsigned.aab"
          fi

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Nem található elkészült Android APK."
            find src-tauri/gen/android/app/build/outputs -type f 2>/dev/null | sort || true
            exit 1
          fi

          if [ -z "$AAB_PATH" ] || [ ! -f "$AAB_PATH" ]; then
            echo "::error::Nem található elkészült Android AAB."
            find src-tauri/gen/android/app/build/outputs -type f 2>/dev/null | sort || true
            exit 1
          fi

          cp "$APK_PATH" "$APK_OUTPUT"
          cp "$AAB_PATH" "$AAB_OUTPUT"

          echo "Android APK: $APK_OUTPUT"
          echo "Android AAB: $AAB_OUTPUT"
          ls -lh artifacts

      - name: Android APK és AAB feltöltése workflow artifactként
        uses: actions/upload-artifact@v6
        with:
          name: arduino-led-controller-android
          path: |
            desktop-tauri/artifacts/*.apk
            desktop-tauri/artifacts/*.aab
          if-no-files-found: error
          retention-days: 30
