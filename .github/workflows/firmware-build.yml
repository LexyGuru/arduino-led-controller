name: Build Arduino firmware

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
      - next/v5-rearchitecture
      - "feature/v5-*"
    paths:
      - "firmware/**"
      - "scripts/test-alpha3-device-key-header.js"
      - ".github/workflows/firmware-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify device-key contract
        run: node scripts/test-alpha3-device-key-header.js

      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Install UNO R4 WiFi core and libraries
        run: |
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli lib update-index
          arduino-cli core install arduino:renesas_uno
          arduino-cli lib install "Adafruit NeoPixel"
          arduino-cli lib install "ArduinoOTA"

      - name: Create non-secret CI configuration
        run: cp firmware/ArduinoLedController/secrets.example.h firmware/ArduinoLedController/secrets.h

      - name: Compile UNO R4 WiFi firmware
        run: |
          set -euo pipefail
          mkdir -p build/firmware
          arduino-cli compile \
            --fqbn arduino:renesas_uno:unor4wifi \
            --output-dir build/firmware \
            --warnings all \
            firmware/ArduinoLedController
          BIN="$(find build/firmware -type f -name '*.ino.bin' -print | sort | head -n 1)"
          test -f "$BIN"
          sha256sum "$BIN" > "$BIN.sha256"

      - name: Upload firmware build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ArduinoLedController-UNO-R4-WiFi
          path: |
            build/firmware/*.ino.bin
            build/firmware/*.ino.bin.sha256
          if-no-files-found: error
          retention-days: 30
