name: Build Arduino firmware

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/setup-arduino-cli@v2
      - name: Install board core and libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:renesas_uno
          arduino-cli lib install "Adafruit NeoPixel"
          arduino-cli lib install ArduinoOTA
      - name: Create non-secret CI configuration
        run: cp firmware/ArduinoLedController/secrets.example.h firmware/ArduinoLedController/secrets.h
      - name: Compile UNO R4 WiFi firmware
        run: |
          mkdir -p build/firmware
          arduino-cli compile --fqbn arduino:renesas_uno:unor4wifi --output-dir build/firmware firmware/ArduinoLedController
      - name: Publish firmware artifact
        uses: actions/upload-artifact@v5
        with:
          name: ArduinoLedController-UNO-R4-WiFi
          path: build/firmware/*
          if-no-files-found: error
      - name: Create public firmware package
        run: |
          FIRMWARE_FILE="$(find build/firmware -type f -name '*.ino.bin' | head -n 1)"
          test -n "${FIRMWARE_FILE}"
          sha256sum "${FIRMWARE_FILE}" > "${FIRMWARE_FILE}.sha256"
      - name: Read firmware version
        run: |
          VERSION="$(sed -nE 's/^#define FIRMWARE_VERSION "([^"]+)"/\1/p' firmware/ArduinoLedController/ArduinoLedController.ino)"
          test -n "${VERSION}"
          echo "FIRMWARE_VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: Publish latest public firmware release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: firmware-latest
          name: Arduino LED Controller firmware (latest)
          body: |
            Automatikusan készített UNO R4 WiFi firmware.
            Firmware verzió: ${{ env.FIRMWARE_VERSION }}
            Forrás commit: ${{ github.sha }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            build/firmware/*.ino.bin
            build/firmware/*.ino.bin.sha256
