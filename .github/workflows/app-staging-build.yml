name: Application staging build

on:
  workflow_dispatch:

  push:
    branches:
      - next/v5-rearchitecture
      - "feature/v5-*"
    paths:
      - "desktop-tauri/**"
      - "docs/api/openapi-v2.json"
      - "scripts/generate-openapi-typescript.js"
      - ".github/workflows/app-staging-build.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Staging metadata gate
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve staging version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  build-desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux staging artifact
            os: ubuntu-22.04
            bundles: appimage,deb
            artifact_name: arduino-led-controller-linux-staging
          - name: macOS staging artifact
            os: macos-latest
            bundles: dmg,app
            artifact_name: arduino-led-controller-macos-staging
          - name: Windows staging artifact
            os: windows-latest
            bundles: nsis
            artifact_name: arduino-led-controller-windows-staging

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: desktop-tauri

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        timeout-minutes: 15
        run: |
          bash ../scripts/ci/install-linux-tauri-deps.sh

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Check Rust backend
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Test Rust backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Verify Tauri updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}" || { echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY"; exit 1; }
          test -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" || { echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD"; exit 1; }

      - name: Build Tauri staging package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: desktop-tauri
          args: --bundles ${{ matrix.bundles }}

      - name: Upload Linux staging packages
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop-tauri/src-tauri/target/release/bundle/deb/*.deb
            desktop-tauri/src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload macOS staging package
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop-tauri/src-tauri/target/release/bundle/dmg/*.dmg
            desktop-tauri/src-tauri/target/release/bundle/macos/*.app.tar.gz
            desktop-tauri/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig

      - name: Upload Windows staging package
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 14
          path: desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe

  build-android:
    name: Android APK and AAB
    needs: validate
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
        working-directory: desktop-tauri
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Tauri CLI
        run: npm install --no-save --package-lock=false @tauri-apps/cli@2.11.4

      - name: Initialize Android project
        run: |
          set -euo pipefail
          if [ ! -d src-tauri/gen/android ]; then
            npx tauri android init --ci
          fi
          test -f src-tauri/gen/android/gradlew
          chmod +x src-tauri/gen/android/gradlew

      - name: Generate V5 Android launcher icons
        run: bash ../scripts/generate-v5-mobile-icons.sh

      - name: Configure Android release signing when available
        id: signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEY_BASE64:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "signed=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Android signing secrets are missing. A debug APK and unsigned AAB will be published."
            exit 0
          fi
          KEYSTORE="${RUNNER_TEMP}/arduino-led-controller-upload.jks"
          printf '%s' "${ANDROID_KEY_BASE64}" | base64 --decode > "${KEYSTORE}"
          chmod 600 "${KEYSTORE}"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          keyAlias=${ANDROID_KEY_ALIAS}
          password=${ANDROID_KEY_PASSWORD}
          storeFile=${KEYSTORE}
          EOF
          python3 <<'PY'
          from pathlib import Path
          import re
          path = Path("src-tauri/gen/android/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          if "import java.util.Properties" not in text:
              text = "import java.util.Properties\nimport java.io.FileInputStream\n" + text
          signing_block = '''
              signingConfigs {
                  create("release") {
                      val keystorePropertiesFile = rootProject.file("keystore.properties")
                      val keystoreProperties = Properties()
                      if (keystorePropertiesFile.exists()) {
                          keystoreProperties.load(FileInputStream(keystorePropertiesFile))
                      }
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["password"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["password"] as String
                  }
              }
          '''
          if 'create("release")' not in text:
              marker = "    buildTypes {"
              if marker not in text:
                  raise SystemExit("Missing buildTypes block")
              text = text.replace(marker, signing_block + marker, 1)
          if 'signingConfig = signingConfigs.getByName("release")' not in text:
              for pattern in [r'(getByName\("release"\)\s*\{)', r'(release\s*\{)']:
                  updated, count = re.subn(
                      pattern,
                      r'\1\n            signingConfig = signingConfigs.getByName("release")',
                      text,
                      count=1,
                  )
                  if count:
                      text = updated
                      break
              else:
                  raise SystemExit("Missing release build type")
          path.write_text(text, encoding="utf-8")
          PY
          echo "signed=true" >> "${GITHUB_OUTPUT}"

      - name: Build signed Android release packages
        if: steps.signing.outputs.signed == 'true'
        run: |
          npx tauri android build --ci --apk
          npx tauri android build --ci --aab

      - name: Build debug APK and unsigned AAB
        if: steps.signing.outputs.signed != 'true'
        run: |
          npx tauri android build --ci --debug --apk
          npx tauri android build --ci --aab

      - name: Collect Android packages
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [ "${SIGNED}" = "true" ]; then
            APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' ! -name '*unsigned*' -print | sort | tail -n 1)"
            AAB="$(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' -print | sort | tail -n 1)"
            APK_OUT="artifacts/Arduino_LED_Controller_${VERSION}_Android.apk"
            AAB_OUT="artifacts/Arduino_LED_Controller_${VERSION}_Android.aab"
          else
            APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*debug*.apk' -print | sort | tail -n 1)"
            AAB="$(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' -print | sort | tail -n 1)"
            APK_OUT="artifacts/Arduino_LED_Controller_${VERSION}_Android_debug.apk"
            AAB_OUT="artifacts/Arduino_LED_Controller_${VERSION}_Android_unsigned.aab"
          fi
          test -f "${APK}"
          test -f "${AAB}"
          cp "${APK}" "${APK_OUT}"
          cp "${AAB}" "${AAB_OUT}"
          find artifacts -maxdepth 1 -type f -print

      - name: Upload Android artifact
        uses: actions/upload-artifact@v6
        with:
          name: arduino-led-controller-android-staging
          path: desktop-tauri/artifacts/*
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: Unsigned iOS and iPadOS IPA
    needs: validate
    runs-on: macos-15
    defaults:
      run:
        shell: bash
        working-directory: desktop-tauri
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Remove unused untrusted Homebrew tap
        run: brew untap aws/tap || true

      - name: Set up Rust iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Tauri CLI
        run: npm install --no-save --package-lock=false @tauri-apps/cli@2.11.4

      - name: Initialize iOS project
        run: |
          if [ ! -d src-tauri/gen/apple ]; then
            npx tauri ios init --ci
          fi

      - name: Generate V5 iOS and iPadOS app icons
        run: bash ../scripts/generate-v5-mobile-icons.sh

      - name: Build unsigned IPA
        run: npx tauri ios build --ci --no-sign

      - name: Collect unsigned IPA
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          IPA="$(find src-tauri/gen/apple -type f -name '*.ipa' -print | sort | tail -n 1)"
          test -f "${IPA}"
          mkdir -p artifacts
          cp "${IPA}" "artifacts/Arduino_LED_Controller_${VERSION}_iOS_iPadOS_unsigned.ipa"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: arduino-led-controller-ios-ipados-staging
          path: desktop-tauri/artifacts/*
          if-no-files-found: error
          retention-days: 14
