[package]
name = "arduino-led-controller"
version = "5.6.0-beta.2"
description = "Standalone Arduino LED Controller"
authors = ["LexyGuru"]
edition = "2021"

[lib]
name = "arduino_led_controller_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arduino-led-core = { path = "../../rust/arduino-led-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
tokio = { version = "1", features = ["time"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
keyring = { version = "=4.1.5", default-features = true }
zeroize = "=1.9.0"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "ios")'.dependencies]
keyring-core = "=1.0.0"
apple-native-keyring-store = { version = "=1.0.1", features = ["protected"] }
zeroize = "=1.9.0"

[target.'cfg(target_os = "android")'.dependencies]
keyring-core = "=1.0.0"
android-native-keyring-store = "=1.0.0"
zeroize = "=1.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSResponder", "NSImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString"] }
